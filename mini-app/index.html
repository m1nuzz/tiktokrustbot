<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TikTok Downloader</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src='//libtl.com/sdk.js' data-zone='11093538' data-sdk='show_11093538' onerror="window._sdkLoadFailed = true" onload="window._sdkLoaded = true"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #38bdf8;
            --success-color: #22c55e;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Inter", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 24px;
            z-index: 10;
        }

        .glass-card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 32px 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        h1 {
            font-size: 28px;
            font-weight: 800;
            margin: 0 0 12px 0;
            letter-spacing: -0.025em;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 16px;
            color: var(--text-secondary);
            margin-bottom: 32px;
            line-height: 1.6;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 60px;
            border-radius: 16px;
            border: none;
            background-color: var(--accent-color);
            color: #ffffff;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
        }

        .btn:active {
            transform: scale(0.98);
            opacity: 0.9;
        }

        .btn-success {
            background-color: var(--success-color);
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
        }

        .spinner-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 5px solid rgba(255, 255, 255, 0.05);
            border-left-color: var(--accent-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .hidden {
            display: none;
        }

        .blob {
            position: absolute;
            width: 200px;
            height: 200px;
            background: var(--accent-color);
            filter: blur(80px);
            opacity: 0.15;
            border-radius: 50%;
            z-index: 1;
        }
        .blob-1 { top: 10%; left: -10%; }
        .blob-2 { bottom: 10%; right: -10%; background: #818cf8; }
    </style>
</head>
<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="container">
        <!-- The loading screen: it owns the first paint and stays up for as long
             as an ad attempt is in flight. It is hidden again the moment the ad
             settles, and a background recovery must never bring it back. -->
        <div id="loader-view" class="spinner-container">
            <div class="spinner"></div>
            <h2 id="loader-text" style="font-size: 18px; color: var(--text-primary); margin: 0;">Loading...</h2>
            <span id="loader-subtext" style="font-size: 14px; color: var(--text-secondary);">Connecting to servers</span>
        </div>

        <!-- Result Card -->
        <div id="content-view" class="glass-card hidden">
            <h1 id="title">Success!</h1>
            <p id="description">Your ad view has been verified. You can now claim your video.</p>
            
            <button id="ad-btn" class="btn hidden">🎬 Start Ad Manually</button>
            <button id="claim-btn" class="btn hidden">🎬 Get my video</button>
            <button id="direct-btn" class="btn btn-success hidden">🚀 Continue to Bot</button>
            
            <div id="status-message" style="margin-top: 20px; font-size: 14px;"></div>
        </div>
    </div>

    <script>
        // SMARTLINK_INJECT
        // ========== КОНФИГУРАЦИЯ ==========
        const AD_CONFIG = {
            zone: '11093538',
            sdkFn: 'show_11093538',
            pollInterval: 3000,
            maxPolls: 60, // ~3 min safety cap, then error screen
            popupMaxTries: 2,
            // The server unlocks a pending row only via the strict gate
            // (valued impression plus watch plus click-or-90s), so a claim
            // must be retried patiently: early attempts answer "not yet".
            claimMaxAttempts: 8,
            claimRetryInterval: 8000,
            // Ad-blocked devices get a text-only screen; the watchdog reloads
            // the SDK in the background so unblocking resumes the ad itself.
            adblockWatchdogInterval: 5000,
            sdkCheckTimeout: 6000,
            // The SDK bundle is served byte-identically from several first-party
            // hosts. A blocker that has poisoned one hostname keeps failing it
            // for the lifetime of the WebView network session, and a query
            // string cannot bypass a hostname-keyed failure, so injections
            // rotate through this list instead of hammering one dead host.
            sdkUrls: [
                'https://libtl.com/sdk.js',
                'https://ill3.com/sdk.js'
            ],
            // Escalation when in-page re-injection cannot revive the SDK: reload
            // the document once with a fresh cache key. sessionStorage survives
            // the reload, so the marker below makes this at most once per
            // WebView and therefore impossible to loop. The delay is long
            // enough that the visibility retry and at least one watchdog tick
            // (cheaper, no navigation) get their chance first.
            adblockReloadDelay: 12000,
            adblockReloadMarker: 'adblock_reload_done',
            // Popup-before-reload: the SDK opens the tab synchronously but
            // iOS creates the native tab asynchronously, so the manual
            // recovery waits for the popup promise to settle before the
            // reload navigation. Hard cap: a hanging show() still reloads.
            adblockPopupSettleMs: 1500,
            // Startup probe: how many times to (re)load the SDK and how long to
            // wait for it before declaring the device ad-blocked.
            sdkProbeAttempts: 2,
            sdkProbeTimeout: 2000,
            // How long we wait for a show() call before giving up on its promise. This is
            // belt-and-braces, NOT a proof: a fixed total timeout can never
            // outlast a user-controlled close time plus Monetag's confirmation
            // ladder (3 polls at 1.5s/3s/4.5s after the close, i.e. up to ~9s
            // beyond it), so a late X can still exceed this. What actually
            // closes that path is the timeout reclassification below (a timeout
            // is decided by the server oracle, never by the clock), the bounded
            // server-side wait and the server-side auto-delivery.
            adTimeout: 45000,
            // Server oracle: whether Monetag ever journaled an ad view for this
            // ymid. Only the server knows; the client cannot infer it.
            impressionUrl: '/api/ad-impression',
            impressionRetries: 2,
            impressionRetryDelay: 1200,
            // Lease heartbeat. The server owns the deadline (it hands back
            // lease_expires_at on every ping and status answer); this client
            // only asks for it and keeps asking while the webapp is open. 60s
            // is the cadence, not a deadline: nothing here decides anything.
            leasePingUrl: '/api/session-ping',
            leasePingIntervalMs: 60000,
            // How close to the server's own deadline the recoverable screen may
            // appear. This is a comparison against a deadline the server handed
            // us, never a clock of our own: the decision is re-taken on each
            // real ping/status answer, and an unknown deadline keeps waiting.
            leaseOfferMarginMs: 5 * 60 * 1000,
            // Bounded wait for the one status probe that picks the first
            // screen: a hung probe must never hold the funnel hostage.
            sessionProbeTimeoutMs: 4000,
            // Session rotation. The ymid the bot put in the URL is an entry
            // point: this asks the server which ymid this press may use. One
            // attempt, bounded, never retried - rotation must never block the
            // funnel, so a failure keeps the current ymid and the ad runs anyway.
            newSessionUrl: '/api/new-session',
            sessionRotateTimeoutMs: 4000,
            // One rotation per WebView, not per document: the ad-block reload
            // escalation deliberately reloads with the SAME ymid so the popup it
            // fires correlates to that row, and rotating there would orphan the
            // postbacks it just produced. sessionStorage outlives the reload
            // inside one WebView.
            sessionRotateMarker: 'session_rotated_ymid',
            // After this many fast polls the wait drops to a slow cadence
            // instead of ending in an error screen. An ad that was never
            // rewarded is not a failure state - the session is still claimable
            // and the server auto-delivers when the valued postback lands.
            pollIntervalSlow: 15000,
        };

        // ========== СОСТОЯНИЕ ==========
        let retryCount = 0;
        let retryTimerId = null;
        let pollTimeoutId = null;
        let isPolling = false;
        let pollCount = 0;
        let popupTries = 0;
        let directAction = 'close'; // 'close' | 'popup' | 'bonus_popup' | 'reload_popup'
        let currentAdSource = null; // 'sdk' или 'popup'
        let claimFired = false; // auto-claim guard: one claim per attempt
        let noAdsShown = false; // no-ads screen visible (upgradeable to adblock)
        let sdkLoadFailed = false; // SDK known missing: skip retry loops, fail fast
        let adblockDetected = false; // DNS filtering blocks the ad SDK host
        let sdkCheckRunning = false; // one SDK re-check at a time
        let adblockWatchdogId = null; // background SDK reload while blocked
        let adAttemptToken = 0; // guards async ad verdicts against stale attempts
        let impressionSeen = false; // this ymid already presented an ad: no new show()
        let adShownAt = 0; // timestamp of the last show() call: proves one ran
        let watchedFastDelivered = false; // per ymid: one fast-path delivery, no doubles
        let sdkInjectCount = 0; // cache-buster for repeated SDK injections
        let bonusPopupDone = false; // bonus offer already taken: no second round
        let sdkHostIndex = 0; // rotates the first SDK host tried per injection
        let lastSdkHost = null; // host that actually registered the SDK global
        let adblockReloadId = null; // one-shot page reload while ad-blocked
        // Server lease deadline for this session as epoch ms (0 = unknown).
        // Never invented locally: every value comes from lease_expires_at in a
        // ping or status answer.
        let leaseDeadlineAt = 0;
        let leasePingId = null; // heartbeat timer, null while stopped
        let leasePingInFlight = false; // one ping at a time
        let offerSurfaceShown = false; // the button/offer screen appeared once
        let sessionTerminal = false; // row is completed/expired/failed

        const tg = window.Telegram.WebApp;
        const loaderView = document.getElementById('loader-view');
        const loaderText = document.getElementById('loader-text');
        const loaderSubtext = document.getElementById('loader-subtext');
        const contentView = document.getElementById('content-view');
        const adBtn = document.getElementById('ad-btn');
        const claimBtn = document.getElementById('claim-btn');
        const directBtn = document.getElementById('direct-btn');
        const statusMsg = document.getElementById('status-message');
        const description = document.getElementById('description');
        const urlParams = new URLSearchParams(window.location.search);
        // Mutable on purpose: this is the ymid the current ad event runs under.
        // The value the bot button supplied is an entry point; rotateSessionYmid()
        // may replace it before the first ad call, and every API call and every
        // show_*() below then uses the new one.
        let ymid = urlParams.get('ymid') || 'unknown_request';
        const apiBase = window.location.origin;

        // Localised UI strings, injected per request by the server
        // (serve_mini_app + i18n::MINI_APP_STRINGS, resolved like the bot:
        // ?lang= wins, else the stored /language override, else English).
        // Falls back to the key name when opened without injection.
        const STRINGS = /*STRINGS_INJECT*/null;
        function t(key) {
            if (typeof STRINGS === 'object' && STRINGS !== null
                && typeof STRINGS[key] === 'string' && STRINGS[key]) return STRINGS[key];
            return key;
        }

        // ========== УТИЛИТЫ ==========
        function cancelRetry() {
            if (retryTimerId) {
                clearTimeout(retryTimerId);
                retryTimerId = null;
            }
        }

        function stopPolling() {
            isPolling = false;
            if (pollTimeoutId) {
                clearTimeout(pollTimeoutId);
                pollTimeoutId = null;
            }
        }

        // SDK-вызовы могут висеть вечно (нет рекламы, рваная сеть):
        // гонка с таймаутом превращает висение в обычную ошибку
        function sdkWithTimeout(promise, ms, label) {
            let timer = null;
            const timeout = new Promise((_, reject) => {
                timer = setTimeout(() => reject(new Error(label + ' timeout')), ms);
            });
            return Promise.race([promise, timeout]).finally(() => clearTimeout(timer));
        }

        // ========== СОСТОЯНИЕ СЕССИИ (сервер владеет дедлайном) ==========
        // The session's lifetime is the SERVER's decision. Every screen below
        // is derived from `lease_expires_at` in a ping/status answer, so the
        // client never keeps a clock of its own and never invents a deadline it
        // would then have to trust.
        function parseLeaseDeadline(raw) {
            if (typeof raw !== 'string' || !raw) return 0;
            // SQLite datetime('now') is UTC, so the string is read as UTC.
            const ms = Date.parse(raw.replace(' ', 'T') + 'Z');
            return Number.isFinite(ms) ? ms : 0;
        }

        function noteLeaseDeadline(data) {
            if (data && typeof data.lease_expires_at === 'string') {
                leaseDeadlineAt = parseLeaseDeadline(data.lease_expires_at);
            }
        }

        // Milliseconds left on the server lease, or null when the server has
        // not told us (old row, or no answer yet). null is read as "keep
        // waiting": surfacing the recoverable screen early is harmless, hiding
        // a real expiry is not.
        function leaseRemainingMs() {
            if (!leaseDeadlineAt) return null;
            return leaseDeadlineAt - Date.now();
        }

        // Every exit from the webapp goes through here. Closing only STOPS the
        // heartbeat - the lease is deliberately never released, so the row keeps
        // whatever time it had at the last ping and a valued postback Monetag
        // sends while the user is on the advertiser's page still finds it live.
        function closeWebapp() {
            stopLeaseHeartbeat();
            tg.close();
        }

        // Lease heartbeat: the only thing that keeps a session claimable beyond
        // the initial window. Started once at load, suspended when the document
        // is backgrounded, resumed on return, stopped for good on pagehide and
        // on close. The answer carries the new deadline, so this doubles as the
        // periodic re-read of the server's view of the row.
        function startLeaseHeartbeat() {
            if (leasePingId || sessionTerminal) return;
            leasePingId = setInterval(leasePing, AD_CONFIG.leasePingIntervalMs);
        }

        function stopLeaseHeartbeat() {
            if (leasePingId) {
                clearInterval(leasePingId);
                leasePingId = null;
            }
        }

        async function leasePing() {
            if (leasePingInFlight || sessionTerminal) return;
            leasePingInFlight = true;
            try {
                const res = await fetch(`${apiBase}${AD_CONFIG.leasePingUrl}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ymid: ymid })
                });
                const data = await res.json();
                noteLeaseDeadline(data);
                if (data && data.live === true) {
                    maybeSurfaceOfferScreen();
                    return;
                }
                // `error` is NOT terminal - it is how the server reports a
                // transient DB failure - so the heartbeat keeps running and the
                // next ping decides. Everything else is a row that can no
                // longer be claimed.
                if (data && data.status && data.status !== 'error') {
                    stopLeaseHeartbeat();
                    handleTerminalStatus(data.status);
                }
            } catch (e) {
                // Network hiccup: the next ping tries again.
            } finally {
                leasePingInFlight = false;
            }
        }

        // What the server says about a row that can no longer be claimed.
        // A delivered row closes the webapp (the video is already in the chat) -
        // never the three-button screen. A lapsed or unknown row, and a row
        // whose download really failed, both say what to do next instead of
        // showing a retry that can never work.
        function handleTerminalStatus(status) {
            sessionTerminal = true;
            stopPolling();
            if (status === 'completed') {
                trackEvent('already_delivered');
                closeWebapp();
                return;
            }
            if (status === 'expired' || status === 'not_found') {
                trackEvent('session_expired');
                showUnclaimableScreen('MiniSessionExpired');
                return;
            }
            if (status === 'failed') {
                // The chat already carries the download-failure message; the
                // mini-app only has to stop pretending the video is coming.
                trackEvent('session_failed');
                showUnclaimableScreen('MiniErrClaim');
            }
        }

        // The ONE place the button/offer screen is allowed to appear, and it is
        // no longer the default result of an unrewarded ad: an ad that settled
        // with nothing valued leaves the page blank and keeps waiting, and this
        // runs only when the server's own lease is nearly gone (or already
        // gone). Surfaced at most once per open.
        function maybeSurfaceOfferScreen() {
            if (offerSurfaceShown || sessionTerminal) return false;
            const remaining = leaseRemainingMs();
            if (remaining === null) return false; // deadline unknown: keep waiting
            if (remaining > AD_CONFIG.leaseOfferMarginMs) return false;
            offerSurfaceShown = true;
            trackEvent('lease_offer_surface');
            showNoAds();
            return true;
        }

        // Waiting is not failing: an impression exists for this ymid, so no
        // second show() may run (one ymid = one ad event), but the session is
        // still claimable. Try the claim once, then poll silently for the valued
        // postback instead of offering three buttons.
        function waitQuietlyForReward() {
            loaderView.classList.add('hidden');
            autoClaim();
            startPolling();
        }

        // True when this document is a reload of a ymid that was already rotated
        // in this WebView (the ad-block reload escalation, an in-page retry).
        function rotationAlreadySpent() {
            try {
                return window.sessionStorage.getItem(AD_CONFIG.sessionRotateMarker) === ymid;
            } catch (e) {
                return false; // storage denied: assume a fresh open, rotate once
            }
        }

        function rememberRotatedYmid() {
            try {
                window.sessionStorage.setItem(AD_CONFIG.sessionRotateMarker, ymid);
            } catch (e) {
                // Private mode: at worst a reload rotates again.
            }
        }

        // Rewrites our own address bar so a reload, a WebView restore or the
        // reload escalation cannot fall back to the spent entry ymid. The `r=`
        // nonce also matches what the WebApp URL already guarantees: every open
        // is a distinct document.
        function replaceUrlYmid() {
            try {
                const params = new URLSearchParams(window.location.search);
                params.set('ymid', ymid);
                params.set('r', Date.now().toString(36) + Math.random().toString(36).slice(2, 10));
                window.history.replaceState(null, '', window.location.pathname + '?' + params.toString());
            } catch (e) {
                // No History API: the in-memory ymid is still the one in use.
            }
        }

        // Asks the server which ymid this ad event runs under. Exactly one
        // bounded attempt: any failure keeps the ymid we already have and the ad
        // proceeds, because a rotation that blocks the funnel costs a video.
        async function rotateSessionYmid() {
            if (rotationAlreadySpent()) return false;
            try {
                const res = await sdkWithTimeout(
                    fetch(`${apiBase}${AD_CONFIG.newSessionUrl}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ ymid: ymid })
                    }),
                    AD_CONFIG.sessionRotateTimeoutMs,
                    'new-session'
                );
                const data = await res.json();
                if (!data || data.success !== true || typeof data.ymid !== 'string' || !data.ymid) {
                    return false;
                }
                ymid = data.ymid;
                // The old row's deadline says nothing about the new one.
                leaseDeadlineAt = 0;
                replaceUrlYmid();
                rememberRotatedYmid();
                trackEvent(data.reused === true ? 'session_reused' : 'session_rotated');
                return true;
            } catch (e) {
                // Keep the current ymid and carry on.
                return false;
            }
        }

        // This row can never be delivered. The only useful action left is a
        // fresh session, so the screen says that and offers a way back to the
        // bot - no retry button, because a retry here could never work.
        function showUnclaimableScreen(messageKey) {
            stopPolling();
            cancelRetry();
            stopLeaseHeartbeat();
            noAdsShown = false;
            loaderView.classList.add('hidden');
            contentView.classList.remove('hidden');
            document.getElementById('title').innerText = t('MiniErrTitle');
            description.innerText = t(messageKey);
            claimBtn.classList.add('hidden');
            adBtn.classList.add('hidden');
            directBtn.innerText = t('MiniBtnContinueBot');
            directAction = 'close';
            directBtn.classList.remove('hidden');
        }

        function showError(message) {
            noAdsShown = false;
            loaderView.classList.add('hidden');
            contentView.classList.remove('hidden');
            document.getElementById('title').innerText = t('MiniErrTitle');
            description.innerText = message;
            claimBtn.classList.add('hidden');
            directAction = 'close';
            directBtn.classList.remove('hidden');
        }

        function showFinalUI(titleText, descText, showDirect) {
            loaderView.classList.add('hidden');
            contentView.classList.remove('hidden');
            document.getElementById('title').innerText = titleText;
            description.innerText = descText;
            directAction = 'close';
            if (showDirect) directBtn.classList.remove('hidden');
            claimBtn.classList.add('hidden');
        }

        // ========== POLLING МЕХАНИЗМ ==========
        async function doPoll() {
            if (!isPolling) return;

            try {
                const res = await fetch(`${apiBase}/api/check-status?ymid=${ymid}`);
                const data = await res.json();
                noteLeaseDeadline(data);

                if (data.status === 'verified') {
                    isPolling = false;
                    onAdSuccess();
                    return;
                }

                // Every terminal state is explicit, so the user never falls back
                // onto the no-fill screen: a delivered row closes (the video is
                // in the chat), a lapsed or unknown one says to start a new
                // session.
                if (data.status === 'completed' || data.status === 'expired'
                    || data.status === 'not_found' || data.status === 'failed') {
                    isPolling = false;
                    handleTerminalStatus(data.status);
                    return;
                }

                // Nothing valued yet and the lease is alive: keep waiting
                // quietly. The screen may come back only when the lease is close
                // to lapsing or has lapsed.
                if (maybeSurfaceOfferScreen()) return;

                pollCount++;
                // No hard stop any more: after the fast window the poll simply
                // slows down. Ending the wait with an error screen is what made
                // a perfectly claimable session look broken.
                const delay = pollCount >= AD_CONFIG.maxPolls
                    ? AD_CONFIG.pollIntervalSlow
                    : AD_CONFIG.pollInterval;
                pollTimeoutId = setTimeout(doPoll, delay);
            } catch (e) {
                // При ошибке сети ждём дольше
                pollTimeoutId = setTimeout(doPoll, AD_CONFIG.pollInterval * 2);
            }
        }

        function startPolling() {
            if (isPolling) return;
            isPolling = true;
            pollCount = 0;
            // Poll silently: keep the current screen, never swap the loader
            // to a "waiting for verification" text.
            doPoll();
        }

// ========== LEVEL 1: SDK Ad ==========
        function trySDKAd() {
            // One ymid = one show: repeated show() calls with the same ymid
            // spam duplicate impression postbacks that Monetag prices at zero
            // (frequency/fraud filtering drove our CPM to dust). Once an
            // impression exists, route to the quiet wait instead.
            if (impressionSeen) {
                trackEvent('retry_suppressed');
                waitQuietlyForReward();
                return;
            }
            claimFired = false; // new attempt: allow one auto-claim
            if (typeof window[AD_CONFIG.sdkFn] !== 'function') {
                // The SDK host is unreachable on this device (ad-block / DNS
                // filtering): text-only screen, no buttons. The probe in
                // startAdFlow() already proved the SDK cannot load.
                sdkLoadFailed = true;
                showAdblock();
                return;
            }
            loaderText.innerText = t('MiniStartingAdTitle');
            loaderSubtext.innerText = t('MiniStartingAdSub');
            currentAdSource = 'sdk';

            const token = ++adAttemptToken;
            // NOTE: the shipped SDK build does not implement `catchIfNoFeed`
            // (the token is absent from its bundle), and its no-ad branch
            // rejects with a reason-free "Empty feed" for both an empty zone
            // and a blocked render. So the flag is kept only for forward
            // compatibility, and every failure is classified through
            // handleAdFailure() + the server impression oracle instead.
            let adPromise;
            try {
                // Request-time marker: the server stamps ad_requested_at from
                // this beacon, which is what proves later that this ymid already
                // carried an ad and must never be reused for another event.
                trackEvent('ad_requested');
                adShownAt = Date.now();
                adPromise = window[AD_CONFIG.sdkFn]({ ymid: ymid, catchIfNoFeed: true, requestVar: 'sdk_interstitial' });
            } catch (e) {
                console.error("Ad threw", e);
                trackEvent('ad_throw');
                handleAdFailure('throw', token);
                return;
            }
            sdkWithTimeout(adPromise, AD_CONFIG.adTimeout, 'sdk')
                .then(async () => {
                    if (token !== adAttemptToken) return;
                    trackEvent('ad_resolve');
                    impressionSeen = true; // a resolved show presented an ad
                    // Fast path first: closing the ad ends the show() call as a
                    // resolve too, and must deliver + close without an
                    // intermediate screen.
                    if (await tryWatchedFastDeliver(token)) return;
                    if (token !== adAttemptToken) return;
                    // Screen contract: the loading screen is up while an ad
                    // attempt is in flight; the ad settling hides it and leaves
                    // the page blank until delivery (tg.close) or a real content
                    // card - nothing of ours changes in between, and a background
                    // recovery (watchdog tick / return) never shows it again.
                    loaderView.classList.add('hidden');
                    // Auto-claim first, then keep polling: whichever wins
                    // (claim gate or valued postback auto-delivery) delivers once.
                    autoClaim();
                    startPolling();
                })
                .catch((e) => {
                    console.error("Ad failed", e);
                    // A timeout is our own clock giving up, not proof that nothing
                    // was ever presented: the user may have watched the ad and
                    // closed it late while Monetag's confirmation ladder was
                    // still running. So it is never treated as blocking here -
                    // handleAdFailure() decides it through the server oracle.
                    const kind = (e && typeof e.message === 'string' && e.message.indexOf('timeout') !== -1)
                        ? 'timeout'
                        : 'reject';
                    trackEvent(kind === 'timeout' ? 'ad_timeout' : 'ad_reject');
                    handleAdFailure(kind, token);
                });
        }

        // Single funnel for every failed ad/popup call. The SDK registers even
        // on ad-blocked devices, so a throw/reject/timeout alone cannot tell
        // "out of inventory" from "ad never shown here". Ask the server whether
        // Monetag recorded a view for this ymid — and keep asking for a long
        // window, because on iOS the impression can land tens of seconds after
        // the page opened (a real case: impression at 22s, long after the ad
        // call looked dead):
        //   a view    -> the ad was presented -> no-fill screen (working claim)
        //   no view   -> nothing was ever presented -> ad-blocked, text-only
        // Fast path for an ad that was really shown: the show() call settled
        // (resolve or reject/timeout - closing the ad ends the call either way)
        // and the server oracle confirms an impression for this ymid. Monetag
        // owns the duration, so the client attests nothing: one claim-video POST
        // carrying only the ymid, and success closes the webapp at once with no
        // intermediate screen. Anything else returns false so the caller falls
        // through to the existing flow unchanged.
        // Token-guarded throughout: a stale attempt never closes the app or
        // disturbs a newer attempt (the token check and the claimFired set
        // run with no await between them, so no newer attempt can slip in
        // between). Single delivery per ymid: a second settle for the same
        // ymid never claims twice.
        async function tryWatchedFastDeliver(token) {
            if (token !== adAttemptToken) return false;
            if (watchedFastDelivered || claimFired) return false;
            if (!adShownAt) return false;
            let hadView = false;
            try {
                hadView = await hasAdImpression();
            } catch (e) {
                hadView = false;
            }
            if (token !== adAttemptToken) return false;
            if (!hadView) return false;
            trackEvent('oracle_impression');
            claimFired = true; // single claim for this attempt
            try {
                const res = await fetch(`${apiBase}/api/claim-video`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ymid: ymid })
                });
                const data = await res.json();
                if (token !== adAttemptToken) return false;
                if (data && data.success) {
                    watchedFastDelivered = true;
                    trackEvent('watched_deliver');
                    closeWebapp();
                    return true;
                }
            } catch (e) {
                // Network hiccup: fall through to the existing flow below.
            }
            claimFired = false; // release: the normal claim/poll flow may run
            return false;
        }

        async function handleAdFailure(kind, token) {
            if (token !== adAttemptToken) return;
            loaderView.classList.add('hidden');
            // An ad that was really shown delivers + closes without any
            // intermediate screen; anything else falls through unchanged.
            if (await tryWatchedFastDeliver(token)) return;
            if (token !== adAttemptToken) return;
            // A timeout is our own clock, not a verdict: on iOS the user may
            // have tapped the creative and left for the offer page, or closed
            // the ad late, while show() stayed pending. Declaring "blocked"
            // without asking strands them on the adblock screen when they come
            // back - so every kind, timeout included, is decided by the oracle.
            const hadView = await hasAdImpression();
            if (token !== adAttemptToken) return;
            trackEvent(hadView ? 'oracle_impression' : 'oracle_none');
            if (!hadView) {
                showAdblock();
            } else if (kind === 'timeout') {
                // The ad was presented and we simply lost the promise to it, so
                // with an impression on record it is handled exactly like a
                // resolve: one claim attempt, then poll silently for the valued
                // postback. Only a definitive "no view" is blocking.
                autoClaim();
                startPolling();
            } else {
                showNoAds();
            }
        }

        // Server oracle: has any ad view ever been journaled for this ymid?
        // One probe per call; the caller loops. Any error counts as "no view".
        async function hasAdImpression() {
            for (let attempt = 1; attempt <= AD_CONFIG.impressionRetries; attempt++) {
                try {
                    const res = await fetch(`${apiBase}${AD_CONFIG.impressionUrl}?ymid=${encodeURIComponent(ymid)}`);
                    const data = await res.json();
                    if (data && data.impression === true) {
                        // A `true` answer arms the impression cap
                        // (one ymid = one show) for every caller at once.
                        impressionSeen = true;
                        return true;
                    }
                    if (data && data.impression === false) {
                        // Only trust a definitive "no" on the last try: the
                        // postback may still be in flight.
                        if (attempt === AD_CONFIG.impressionRetries) return false;
                    }
                } catch (e) {
                    // network error: retry, then fall through to "no impression"
                }
                await new Promise(r => setTimeout(r, AD_CONFIG.impressionRetryDelay));
            }
            return false;
        }

        // Entry point: prove the ad SDK can actually load before showing
        // anything else. A fetch() probe is not trustworthy here — many iOS
        // blockers answer with a stub page instead of failing — so the only
        // reliable test is loading the SDK script itself.
        async function startAdFlow() {
            loaderText.innerText = t('MiniCheckingNetTitle');
            loaderSubtext.innerText = t('MiniCheckingNetSub');
            trackEvent('probe_start');
            for (let attempt = 1; attempt <= AD_CONFIG.sdkProbeAttempts; attempt++) {
                if (typeof window[AD_CONFIG.sdkFn] === 'function') { break; }
                injectSdkScript();
                if (await waitForSdk(AD_CONFIG.sdkProbeTimeout)) { break; }
                sdkLoadFailed = true;
            }
            if (typeof window[AD_CONFIG.sdkFn] !== 'function') {
                // The SDK host never answered: ad-blocking (app or DNS filtering)
                // is the realistic cause, so say it plainly instead of showing a
                // retry that cannot help.
                trackEvent('sdk_probe_fail');
                showAdblock();
                return;
            }
            // Fresh page, impressed ymid (reopen/reload after an ad already
            // presented): do not fire another show(), wait quietly for the
            // reward instead.
            if (await impressionKnown()) {
                trackEvent('retry_suppressed');
                waitQuietlyForReward();
                return;
            }
            trySDKAd();
        }

        // Cap helper: has this ymid already produced an impression (this page
        // or an earlier one, e.g. before a reload)? If yes, no new show().
        async function impressionKnown() {
            if (impressionSeen) return true;
            if (await hasAdImpression()) {
                impressionSeen = true;
                trackEvent('oracle_impression');
                return true;
            }
            return false;
        }

        // Injects the SDK script tag. Repeatable: used by the startup probe
        // and by the ad-block watchdog. onError lets the watchdog settle its
        // wait immediately instead of polling until the timeout.
        //
        // Every injection walks the whole sdkUrls list before reporting a
        // failure, and the starting host rotates between injections so a dead
        // hostname is not retried first every time.
        function injectSdkScript(onError) {
            const total = AD_CONFIG.sdkUrls.length;
            const start = sdkHostIndex % total;
            sdkHostIndex++;
            let tried = 0;

            const tryHost = () => {
                if (tried >= total) {
                    if (onError) onError();
                    return;
                }
                const url = AD_CONFIG.sdkUrls[(start + tried) % total];
                tried++;
                sdkInjectCount++;
                lastSdkHost = url.replace('https://', '').replace('/sdk.js', '');
                const script = document.createElement('script');
                // Cache-bust every injection so a stale HTTP entry for the
                // plain URL cannot be reused after the blocker is switched off.
                script.src = url + '?_=' + Date.now() + '_' + sdkInjectCount;
                script.async = true;
                script.setAttribute('data-zone', AD_CONFIG.zone);
                script.setAttribute('data-sdk', AD_CONFIG.sdkFn);
                script.onerror = () => {
                    window._sdkLoadFailed = true;
                    tryHost();
                };
                document.head.appendChild(script);
            };

            tryHost();
        }

// ========== УРОВЕНЬ 2: Popup (быстрый оффер вместо SmartLink) ==========
        // Вызывается ТОЛЬКО из клика (требование popup-blocker'ов).
        // Постбэк impression прилетает как обычно; claim — общий.
        function tryPopup(requestVar) {
            claimFired = false; // new attempt: allow one auto-claim
            if (typeof window[AD_CONFIG.sdkFn] !== 'function') {
                // SDK missing (blocked script): the offer cannot open either,
                // so don't bounce back to the same screen — go to the video.
                sdkLoadFailed = true;
                adblockDetected = true;
                showAdblock();
                return;
            }
            cancelRetry();
            stopPolling();
            if (popupTries >= AD_CONFIG.popupMaxTries) {
                showGuaranteedClaim();
                return;
            }
            popupTries++;
            loaderText.innerText = t('MiniOpeningOfferTitle');
            loaderSubtext.innerText = t('MiniOpeningOfferSub');
            const token = ++adAttemptToken;
            try {
                trackEvent('ad_requested');
                adShownAt = Date.now();
                const popupPromise = window[AD_CONFIG.sdkFn]({
                    ymid: ymid,
                    type: 'pop',
                    requestVar: requestVar || ('popup_retry_' + popupTries),
                    catchIfNoFeed: true
                });
                sdkWithTimeout(popupPromise, AD_CONFIG.adTimeout, 'popup')
                    .then(async () => {
                        if (token !== adAttemptToken) return;
                        // Same fast path as the interstitial resolve: closing the offer
                        // delivers + closes at once.
                        if (await tryWatchedFastDeliver(token)) return;
                        if (token !== adAttemptToken) return;
                        loaderView.classList.add('hidden');
                        // Auto-claim first, then keep polling: whichever wins
                        // (claim gate or valued postback auto-delivery) delivers once.
                        autoClaim();
                        startPolling();
                    })
                    .catch((e) => {
                        console.error("Popup failed", e);
                        // Same rule as the interstitial: a timeout is our clock
                        // running out, never proof that no offer was presented,
                        // so it is the oracle that classifies it.
                        const kind = (e && typeof e.message === 'string' && e.message.indexOf('timeout') !== -1)
                            ? 'timeout'
                            : 'reject';
                        trackEvent(kind === 'timeout' ? 'ad_timeout' : 'ad_reject');
                        handleAdFailure(kind, token);
                    });
            } catch (e) {
                console.error("Popup threw", e);
                handleAdFailure('throw', token);
            }
        }

// No ad could be loaded even though the SDK works (no fill / network):
        // offer the video, a quick offer, or one ad retry — all functional.
        function showNoAds() {
            stopPolling();
            cancelRetry();
            noAdsShown = true;
            loaderView.classList.add('hidden');
            contentView.classList.remove('hidden');
            document.getElementById('title').innerText = t('MiniNoAdsTitle');
            description.innerText = t('MiniNoAdsDesc');
            // Every visible button must do something: claim / offer / retry.
            trackEvent('no_fill_screen');
            claimBtn.innerText = t('MiniBtnGetVideo');
            claimBtn.classList.remove('hidden');
            directBtn.innerText = t('MiniBtnQuickOffer');
            directAction = 'popup';
            directBtn.classList.remove('hidden');
            adBtn.innerText = t('MiniBtnRetryAd');
            adBtn.classList.remove('hidden');
        }

// Ad-blocked device: no ad view and no offer are possible. Text-only screen:
// we do not hand out the video for free and we do not offer dead buttons —
// just tell the user what to fix. Recovery is automatic: a background watchdog
// re-runs the ad attempt, so returning to the app after disabling the blocker
// (or on the next watchdog tick) starts the ad without any tap.
        function showAdblock() {
            stopPolling();
            cancelRetry();
            noAdsShown = false;
            // Marks "the ad cannot run here" for the visibility handler: the
            // user most likely just turned their blocker off.
            adblockDetected = true;
            loaderView.classList.add('hidden');
            contentView.classList.remove('hidden');
            document.getElementById('title').innerText = t('MiniAdblockTitle');
            description.innerText = t('MiniAdblockDesc');
            // A reload carrying ?pop=fail|timeout means the last offer tap
            // found no ad to open: say so instead of repeating the base text.
            const popOutcome = urlParams.get('pop');
            if (popOutcome === 'fail' || popOutcome === 'timeout') {
                description.innerText += t('MiniAdblockMiss');
            }
            claimBtn.classList.add('hidden');
            adBtn.classList.add('hidden');
            // One manual recovery path: reload the document (fresh SDK load
            // attempt) and fire a popup inside the tap gesture. Its
            // impression/valued postbacks correlate to this same ymid.
            directBtn.innerText = t('MiniBtnReloadOffer');
            directAction = 'reload_popup';
            directBtn.classList.remove('hidden');
            trackEvent('adblock_popup_shown');
            trackEvent('adblock_screen');
            armAdblockWatchdog();
            armAdblockPageReload();
        }

        // Last-resort recovery for the ad-block screen: reload the document once
        // with a fresh cache key. This buys a new document and a new HTTP cache
        // entry, but it keeps the same WebView, so it cannot clear a failure the
        // network stack remembers per hostname - that is why the SDK host
        // rotation in injectSdkScript() is tried first and on every tick.
        function armAdblockPageReload() {
            if (adblockReloadId) return;
            adblockReloadId = setTimeout(reloadPageOnce, AD_CONFIG.adblockReloadDelay);
        }

        function disarmAdblockPageReload() {
            if (adblockReloadId) {
                clearTimeout(adblockReloadId);
                adblockReloadId = null;
            }
        }

        function reloadPageOnce() {
            adblockReloadId = null;
            // Never disturb a working SDK, a running ad, or a claim in flight.
            if (typeof window[AD_CONFIG.sdkFn] === 'function') return;
            if (isPolling || claimFired || adAttemptToken > 0) return;
            if (!claimPageReload()) return;
            trackEvent('page_reload');
            navigateTo(location.pathname
                + '?ymid=' + encodeURIComponent(ymid)
                + '&r=' + Date.now());
        }

        // One reload per WebView, shared by the automatic escalation above
        // and the manual button below. Returns true when this call consumed
        // the single reload.
        function claimPageReload() {
            try {
                // sessionStorage outlives the reload inside one WebView, so
                // this marker caps the escalation: no loop, no reload storm
                // while the blocker stays on.
                if (window.sessionStorage.getItem(AD_CONFIG.adblockReloadMarker) === '1') return false;
                window.sessionStorage.setItem(AD_CONFIG.adblockReloadMarker, '1');
                return true;
            } catch (e) {
                // Storage denied (private mode): allow the single in-page
                // attempt, the page is going away anyway.
                return true;
            }
        }

        // Navigates to a fresh document. Separate function so tests can
        // observe the navigation target (jsdom cannot perform navigation).
        function navigateTo(url) {
            location.replace(url);
        }

        // Manual recovery on the adblock screen: fire a popup inside the user
        // gesture (popup-blockers allow it), then reload the document with
        // the SAME ymid so the popup's impression/valued postbacks correlate
        // to this row. The new tab survives our navigation. Without an SDK
        // there is nothing to fire — the reload alone still gives a clean
        // document that retries the SDK load with host rotation.
        //
        // The SDK opens the tab synchronously, but the host WebView creates
        // the native tab asynchronously: navigating away in the same task
        // tears down the document before iOS finishes the open, so no tab
        // appears. The call below stays synchronous to keep the user
        // gesture; only the navigation waits — for the popup to settle or
        // for the cap below, whichever comes first, so a hanging show()
        // can never trap the user. The offer URL is never exposed by the
        // SDK (show() resolves with no value), so a placeholder tab or
        // Telegram.WebApp.openLink cannot be used here — waiting is the
        // only available fix.
        function reloadAndPopup() {
            trackEvent('adblock_popup_tapped');
            let popupPromise = null;
            let sdkPresent = false;
            if (typeof window[AD_CONFIG.sdkFn] === 'function') {
                sdkPresent = true;
                try {
                    trackEvent('ad_requested');
                    popupPromise = window[AD_CONFIG.sdkFn]({
                        ymid: ymid,
                        type: 'pop',
                        requestVar: 'adblock_popup',
                        catchIfNoFeed: true
                    });
                    // Attach a no-op rejection handler immediately so a fast
                    // reject never surfaces as an unhandled rejection; the
                    // settle handler below still runs the navigation.
                    if (popupPromise && typeof popupPromise.catch === 'function') popupPromise.catch(() => {});
                } catch (e) {
                    popupPromise = null;
                }
            }
            if (!claimPageReload()) {
                // Marker already spent: no navigation. If the popup failed
                // (or there was no SDK to fire it), say so transiently —
                // otherwise the tap visibly does nothing at all.
                if (popupPromise && typeof popupPromise.then === 'function') {
                    popupPromise.then(() => {}, () => showTransientOfferMiss());
                } else {
                    showTransientOfferMiss();
                }
                return;
            }
            trackEvent('page_reload');
            const base = location.pathname
                + '?ymid=' + encodeURIComponent(ymid)
                + '&r=' + Date.now();
            if (!popupPromise || typeof popupPromise.then !== 'function') {
                navigateTo(base + '&pop=' + (sdkPresent ? 'fail' : 'none'));
                return;
            }
            let navigated = false;
            const go = (outcome) => {
                if (navigated) return;
                navigated = true;
                clearTimeout(timer);
                navigateTo(base + '&pop=' + outcome);
            };
            const timer = setTimeout(() => go('timeout'), AD_CONFIG.adblockPopupSettleMs);
            popupPromise.then(() => go('ok'), () => go('fail'));
        }

        // The offer didn't open and the page is staying: replace silence with
        // one honest line, then restore the screen text.
        function showTransientOfferMiss() {
            const prev = description.innerText;
            description.innerText = t('MiniAdblockMiss').trim();
            setTimeout(() => {
                if (document.getElementById('title').innerText.includes(t('MiniAdblockTitle'))) {
                    description.innerText = prev;
                }
            }, 4000);
        }

        // ========== TELEMETRY ==========
        // The mini-app cannot distinguish "zone out of inventory" from "ad
        // blocked on this device" (the SDK rejects both as 'Empty feed'), so
        // every stage transition is reported and correlated with
        // monetag_postbacks by ymid. Fire-and-forget: never awaited, never
        // allowed to throw into the funnel flow.
        const TRACKED_STAGES = new Set([
            'probe_start', 'sdk_host_ok', 'sdk_probe_fail', 'adblock_screen',
            'ad_resolve', 'ad_reject', 'ad_timeout', 'ad_throw',
            'oracle_impression', 'oracle_none', 'no_fill_screen', 'page_reload',
            'watchdog_recover', 'bonus_popup_shown', 'bonus_popup_tapped',
            'adblock_popup_shown', 'adblock_popup_tapped', 'retry_suppressed',
            'claim_tapped', 'already_delivered', 'watched_deliver',
            'session_expired', 'session_failed', 'lease_offer_surface',
            'ad_requested', 'session_rotated', 'session_reused'
        ]);
        const trackedSent = new Set();

        function trackPlatform() {
            const ua = navigator.userAgent || '';
            if (/iPhone|iPad|iPod/i.test(ua)) return 'ios';
            if (/Android/i.test(ua)) return 'android';
            // iPadOS reports as Macintosh; touch points give it away.
            if (/iPad|Macintosh/i.test(ua) && (navigator.maxTouchPoints || 0) > 1) return 'ios';
            return 'desktop';
        }

        function trackEvent(stage) {
            try {
                if (!TRACKED_STAGES.has(stage) || trackedSent.has(stage)) return;
                trackedSent.add(stage);
                const body = JSON.stringify({
                    ymid: ymid,
                    event: stage,
                    platform: trackPlatform(),
                    sdk_host: lastSdkHost || null,
                    user_agent: (navigator.userAgent || '').slice(0, 250)
                });
                // sendBeacon survives Telegram closing the webapp; keepalive
                // fetch is the fallback. Neither is awaited. A plain string
                // goes out as text/plain — fine, the server parses any body —
                // but a Blob carries the right type for proxies in between.
                if (navigator.sendBeacon) {
                    try {
                        navigator.sendBeacon(
                            `${apiBase}/api/mini-app-event`,
                            new Blob([body], { type: 'application/json' })
                        );
                    } catch (e) {
                        navigator.sendBeacon(`${apiBase}/api/mini-app-event`, body);
                    }
                } else {
                    fetch(`${apiBase}/api/mini-app-event`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: body,
                        keepalive: true
                    }).catch(() => {});
                }
            } catch (e) {
                // Telemetry must never break the funnel.
            }
        }

        // Polls for the SDK global: a fresh script tag may load and register it
        // before onload fires, so the wait must not depend on the event.
        function waitForSdk(ms) {
            return new Promise((resolve) => {
                const t0 = Date.now();
                const iv = setInterval(() => {
                    if (typeof window[AD_CONFIG.sdkFn] === 'function') {
                        clearInterval(iv);
                        trackEvent('sdk_host_ok');
                        resolve(true);
                    } else if (Date.now() - t0 > ms) {
                        clearInterval(iv);
                        resolve(false);
                    }
                }, 200);
            });
        }

        function armAdblockWatchdog() {
            if (adblockWatchdogId) return;
            // Only poll while the SDK script itself is unreachable — that is the
            // one blocked state a background reload can fix on its own. When the
            // script loads but the ad never presents, re-calling show() on a
            // timer would just hammer the ad network, so recovery waits for the
            // visibility handler instead.
            if (typeof window[AD_CONFIG.sdkFn] === 'function') return;
            adblockWatchdogId = setInterval(retrySdkSilently, AD_CONFIG.adblockWatchdogInterval);
        }

        function disarmAdblockWatchdog() {
            if (adblockWatchdogId) {
                clearInterval(adblockWatchdogId);
                adblockWatchdogId = null;
            }
            sdkCheckRunning = false;
        }

        // Reload the SDK in the background and start the ad the moment it
        // registers. No user interaction required.
        function retrySdkSilently() {
            if (sdkCheckRunning) return;
            if (typeof window[AD_CONFIG.sdkFn] === 'function') {
                startAdAttempt();
                return;
            }
            sdkCheckRunning = true;
            sdkLoadFailed = false;

            let settled = false;
            const finish = (ok) => {
                if (settled) return;
                settled = true;
                sdkCheckRunning = false;
                if (ok) startAdAttempt();
            };

            injectSdkScript(() => finish(false));
            waitForSdk(AD_CONFIG.sdkCheckTimeout).then(finish);
        }

        function startAdAttempt() {
            // Cap: the watchdog/visibility auto-recovery must not re-fire an
            // ad for a ymid that already produced an impression.
            if (impressionSeen) {
                trackEvent('retry_suppressed');
                return;
            }
            if (adblockDetected) trackEvent('watchdog_recover');
            disarmAdblockWatchdog();
            disarmAdblockPageReload();
            adblockDetected = false;
            sdkLoadFailed = false;
            // Stale flag from the first blocked load would otherwise bounce us
            // straight back to the adblock screen.
            window._sdkLoadFailed = false;
            retryCount = 0;
            popupTries = 0;
            claimFired = false;
            directAction = 'close';
            // Background recovery (watchdog tick / return from the offer page):
            // it must be invisible and must not touch the current screen. The
            // ad overlay is its own visual; the loader view is never shown.
            trySDKAd();
        }

        // Popup tries exhausted: claim via the strict gate, no taps.
        function showGuaranteedClaim() {
            stopPolling();
            cancelRetry();
            noAdsShown = false;
            loaderView.classList.add('hidden');
            contentView.classList.remove('hidden');
            document.getElementById('title').innerText = t('MiniVideoReadyTitle');
            description.innerText = t('MiniVideoReadyDesc');
            claimBtn.classList.add('hidden');
            adBtn.classList.add('hidden');
            autoClaim();
        }

        // Single auto-claim: fired after any ad/popup resolves or when the user
        // takes the video, guarded so concurrent callers can't double-fire.
        // The server answers "not yet" until the strict gate passes, so
        // this retries patiently instead of giving up and looking broken.
        async function autoClaim() {
            if (claimFired) return;
            claimFired = true;
            for (let attempt = 1; attempt <= AD_CONFIG.claimMaxAttempts; attempt++) {
                let ok = false;
                let claimStatus = null;
                try {
                    const claimRes = await fetch(`${apiBase}/api/claim-video`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ ymid: ymid })
                    });
                    const claimData = await claimRes.json();
                    ok = !!claimData.success;
                    if (claimData && typeof claimData.status === 'string') claimStatus = claimData.status;
                } catch (e) {
                    ok = false; // network hiccup: retry
                }

                if (ok) {
                    closeWebapp();
                    return;
                }

                // The refusal names the row's state, so a session that is gone
                // says so instead of masquerading as "not yet".
                if (claimStatus === 'expired' || claimStatus === 'not_found'
                    || claimStatus === 'completed') {
                    handleTerminalStatus(claimStatus);
                    return;
                }

                if (attempt === AD_CONFIG.claimMaxAttempts) {
                    // Nothing valued yet is NOT a failure: the row is still
                    // claimable, the server auto-delivers when the valued
                    // postback lands, and the heartbeat keeps the session alive.
                    // Stay silent; the screen returns only when the lease is
                    // nearly gone.
                    maybeSurfaceOfferScreen();
                    return;
                }

                // Visible progress so the wait never looks like a dead button.
                claimBtn.innerText = t('MiniClaimProgress').replace('{n}', attempt).replace('{m}', AD_CONFIG.claimMaxAttempts);
                claimBtn.classList.remove('hidden');
                await new Promise(r => setTimeout(r, AD_CONFIG.claimRetryInterval));
            }
        }

        // ========== УСПЕШНЫЙ ПРОСМОТР ==========
        function onAdSuccess() {
            stopPolling();
            cancelRetry();
            noAdsShown = false;

            loaderView.classList.add('hidden');
            contentView.classList.remove('hidden');

            document.getElementById('title').innerText = t('MiniSuccessTitle');
            description.innerText = t('MiniSuccessDesc');
            claimBtn.classList.add('hidden');
            adBtn.classList.add('hidden');
            directBtn.classList.add('hidden');
            // Monetag owns the duration and the client no longer keeps a watch
            // clock of its own, so there is nothing left to wait for here: the
            // valued/green Continue appears as soon as the server reports the
            // row delivered, with no client-side watch wait.
            // Green Continue: the video is already on its way (server
            // auto-delivers on valued), so this tap is a pure bonus — a
            // popup offer that can only add revenue, never lose the video.
            // After the bonus was taken once, the button is a plain close
            // so returning from the offer cannot loop back into another one.
            if (bonusPopupDone) {
                directBtn.innerText = t('MiniBtnContinueBot');
                directAction = 'close';
            } else {
                directBtn.innerText = t('MiniBtnContinue');
                directAction = 'bonus_popup';
                trackEvent('bonus_popup_shown');
            }
            directBtn.classList.remove('hidden');
            autoClaim();

            if (tg.HapticFeedback) {
                tg.HapticFeedback.notificationOccurred('success');
            }
        }

        // ========== ИНИЦИАЛИЗАЦИЯ ==========
        loaderText.innerText = t('MiniLoadingTitle');
        loaderSubtext.innerText = t('MiniLoadingSub');
        tg.ready();
        tg.expand();
        // No claim buttons anywhere: keep the main button hidden defensively.
        tg.MainButton.hide();

        if (tg.themeParams.button_color) {
            document.documentElement.style.setProperty('--accent-color', tg.themeParams.button_color);
        }

        // The server's own view of this row picks the first screen: a delivered
        // session closes straight away and a lapsed one says so, instead of
        // reopening onto the no-fill screen. A failed/unreachable probe is not
        // an answer - it falls through to the normal funnel unchanged.
        // Bounded with the same race the SDK calls use: a hung probe must never
        // hold the funnel hostage.
        async function probeSessionBeforeAd() {
            try {
                const res = await sdkWithTimeout(
                    fetch(`${apiBase}/api/check-status?ymid=${encodeURIComponent(ymid)}`),
                    AD_CONFIG.sessionProbeTimeoutMs,
                    'session-probe'
                );
                const data = await res.json();
                noteLeaseDeadline(data);
                const status = data && data.status;
                if (status === 'completed' || status === 'expired'
                    || status === 'not_found' || status === 'failed') {
                    return status;
                }
            } catch (e) {
                // Unknown state: fall through to the normal funnel.
            }
            return null;
        }

// Проверяем статус рекламы (ymid — чтобы сервер решил персонально:
        // админ с Admin Ads ON увидит реальную рекламу даже при глобальном OFF)
        async function boot() {
            // Probe the entry ymid first: a row the server already delivered must
            // close the webapp, not start a second ad for the same video.
            const terminal = await probeSessionBeforeAd();
            if (terminal) {
                handleTerminalStatus(terminal);
                return;
            }
            // Then settle which ymid this ad event runs under - before any ad
            // call, so one press is never two ad events on one ymid.
            await rotateSessionYmid();
            // The heartbeat starts before anything else can settle: it is what
            // keeps this session claimable while the user watches the ad.
            startLeaseHeartbeat();
            try {
                const response = await fetch(`${apiBase}/api/ads-status?ymid=${encodeURIComponent(ymid)}`);
                const data = await response.json();
                if (data.enabled) {
        // Prove the SDK can load first, then run the ad. A blocked SDK host
    // (ad-block / DNS filtering) must end on the text-only adblock screen,
  // never on the retry screen.
                    startAdFlow();
                } else {
                    directAction = 'close';
                    directBtn.innerText = t('MiniBtnContinueBot');
                    showFinalUI(t('MiniReadyTitle'), t('MiniReadyDesc'), true);
                }
            } catch (e) {
                console.error(e);
                showError(t('MiniErrNoServer'));
            }
        }
        boot();

        // Обработчик кнопки Start Ad Manually / Try ad again
        adBtn.addEventListener('click', () => {
            cancelRetry();
            stopPolling();
            retryCount = 0;
            sdkLoadFailed = false; // explicit retry: one fresh attempt
            popupTries = 0;
            claimFired = false; // new attempt: allow one auto-claim
            adBtn.classList.add('hidden');
            claimBtn.classList.add('hidden');
            // A tapped retry is a fresh ad fetch, so the loading screen comes
            // back for it: there is nothing to read on the card meanwhile.
            loaderView.classList.remove('hidden');
            contentView.classList.add('hidden');
            trySDKAd();
        });

// Claim button: the video itself. Re-arms the guard so a retry after an
        // error works, and gives instant feedback while the server gate
        // is still closed.
        claimBtn.addEventListener('click', () => {
            trackEvent('claim_tapped');
            cancelRetry();
            stopPolling();
            claimFired = false;
            claimBtn.innerText = t('MiniClaimBusy');
            autoClaim();
        });

        // Continue button: 'popup' opens the quick offer, 'bonus_popup'
        // opens the post-reward bonus offer (the video is already delivered
        // by the server on valued, so this tap cannot lose anything),
        // otherwise just close.
        directBtn.addEventListener('click', () => {
            if (directAction === 'popup') {
                directAction = 'close';
                directBtn.innerText = t('MiniBtnContinueBot');
                tryPopup();
            } else if (directAction === 'bonus_popup') {
                directAction = 'close';
                directBtn.innerText = t('MiniBtnContinueBot');
                bonusPopupDone = true;
                trackEvent('bonus_popup_tapped');
                tryPopup('valued_bonus_popup');
            } else if (directAction === 'reload_popup') {
                reloadAndPopup();
            } else {
                closeWebapp();
            }
        });

        // The user may have tapped the creative and left for the offer page
        // while show() stayed pending; the timeout then strands them on the
        // adblock text. On return, ask the oracle once: an impression that
        // landed while they were away upgrades the screen to the working
        // no-fill screen instead of leaving them stuck.
        async function recheckOracleOnReturn() {
            if (isPolling || !adblockDetected) return false;
            if (contentView.classList.contains('hidden')) return false;
            if (await hasAdImpression()) {
                trackEvent('oracle_impression');
                showNoAds();
                return true;
            }
            return false;
        }

        // Visibility API: Мгновенный запрос при возврате в приложение
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState !== 'visible') {
                // Backgrounded - usually because the user tapped the creative
                // and left for the advertiser's page. Stop extending the lease
                // and never release it: the row keeps whatever remained at the
                // last ping, which is what lets a valued postback that arrives
                // while they are away still deliver.
                stopLeaseHeartbeat();
                return;
            }
            // Back in the app: resume the heartbeat and ask the server
            // immediately instead of waiting for the next tick.
            startLeaseHeartbeat();
            if (isPolling) {
                clearTimeout(pollTimeoutId); // Отменяем ожидание
                doPoll(); // Делаем запрос ПРЯМО СЕЙЧАС
            } else if (adblockDetected) {
                // User most likely just switched off their ad-blocker: retry
                // the SDK right away instead of waiting for the watchdog tick.
                recheckOracleOnReturn().then((upgraded) => {
                    if (!upgraded) retrySdkSilently();
                });
            }
        });

        // Telegram tears the WebView down after tg.close(); pagehide is the last
        // reliable signal that this document is gone for good. Stopping only
        // stops EXTENDING - the lease is left exactly as it was.
        window.addEventListener('pagehide', () => {
            stopLeaseHeartbeat();
        });
    </script>
</body>
</html>

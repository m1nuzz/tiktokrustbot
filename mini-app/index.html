<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TikTok Downloader</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src='//libtl.com/sdk.js' data-zone='11093538' data-sdk='show_11093538' onerror="window._sdkLoadFailed = true" onload="window._sdkLoaded = true"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #38bdf8;
            --success-color: #22c55e;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Inter", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 24px;
            z-index: 10;
        }

        .glass-card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 32px 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        h1 {
            font-size: 28px;
            font-weight: 800;
            margin: 0 0 12px 0;
            letter-spacing: -0.025em;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 16px;
            color: var(--text-secondary);
            margin-bottom: 32px;
            line-height: 1.6;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 60px;
            border-radius: 16px;
            border: none;
            background-color: var(--accent-color);
            color: #ffffff;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
        }

        .btn:active {
            transform: scale(0.98);
            opacity: 0.9;
        }

        .btn-success {
            background-color: var(--success-color);
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
        }

        .spinner-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 5px solid rgba(255, 255, 255, 0.05);
            border-left-color: var(--accent-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .hidden {
            display: none;
        }

        .blob {
            position: absolute;
            width: 200px;
            height: 200px;
            background: var(--accent-color);
            filter: blur(80px);
            opacity: 0.15;
            border-radius: 50%;
            z-index: 1;
        }
        .blob-1 { top: 10%; left: -10%; }
        .blob-2 { bottom: 10%; right: -10%; background: #818cf8; }
    </style>
</head>
<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="container">
        <!-- Persistent Loader -->
        <div id="loader-view" class="spinner-container">
            <div class="spinner"></div>
            <h2 id="loader-text" style="font-size: 18px; color: var(--text-primary); margin: 0;">Loading...</h2>
            <span id="loader-subtext" style="font-size: 14px; color: var(--text-secondary);">Connecting to servers</span>
        </div>

        <!-- Result Card -->
        <div id="content-view" class="glass-card hidden">
            <h1 id="title">Success!</h1>
            <p id="description">Your ad view has been verified. You can now claim your video.</p>
            
            <button id="ad-btn" class="btn hidden">🎬 Start Ad Manually</button>
            <button id="direct-btn" class="btn hidden">🚀 Continue to Bot</button>
            
            <div id="status-message" style="margin-top: 20px; font-size: 14px;"></div>
        </div>
    </div>

    <script>
        // SMARTLINK_INJECT
        // ========== КОНФИГУРАЦИЯ ==========
        const AD_CONFIG = {
            zone: '11093538',
            sdkFn: 'show_11093538',
            maxRetries: 8,
            retryInterval: 1200,
            pollInterval: 3000,
            maxPolls: 60, // ~3 min safety cap, then error screen
            popupMaxTries: 2,
            inApp: { frequency: 2, capping: 0.1, interval: 30, timeout: 5, everyPage: false }
        };

        // ========== СОСТОЯНИЕ ==========
        let retryCount = 0;
        let retryTimerId = null;
        let pollTimeoutId = null;
        let isPolling = false;
        let pollCount = 0;
        let pollStartTime = 0;
        let timerClaimShown = false;
        let inAppStarted = false;
        let popupTries = 0;
        let directAction = 'close'; // 'close' | 'popup'
        let currentAdSource = null; // 'sdk' или 'popup'

        const tg = window.Telegram.WebApp;
        const loaderView = document.getElementById('loader-view');
        const loaderText = document.getElementById('loader-text');
        const loaderSubtext = document.getElementById('loader-subtext');
        const contentView = document.getElementById('content-view');
        const adBtn = document.getElementById('ad-btn');
        const directBtn = document.getElementById('direct-btn');
        const statusMsg = document.getElementById('status-message');
        const description = document.getElementById('description');
        const urlParams = new URLSearchParams(window.location.search);
        const ymid = urlParams.get('ymid') || 'unknown_request';
        const apiBase = window.location.origin;

        // ========== УТИЛИТЫ ==========
        function cancelRetry() {
            if (retryTimerId) {
                clearTimeout(retryTimerId);
                retryTimerId = null;
            }
        }

        function stopPolling() {
            isPolling = false;
            if (pollTimeoutId) {
                clearTimeout(pollTimeoutId);
                pollTimeoutId = null;
            }
        }

        // SDK-вызовы могут висеть вечно (нет рекламы, рваная сеть):
        // гонка с таймаутом превращает висение в обычную ошибку
        function sdkWithTimeout(promise, ms, label) {
            let timer = null;
            const timeout = new Promise((_, reject) => {
                timer = setTimeout(() => reject(new Error(label + ' timeout')), ms);
            });
            return Promise.race([promise, timeout]).finally(() => clearTimeout(timer));
        }

        function updateRetryUI(count) {
            loaderText.innerText = "Loading Ad...";
            loaderSubtext.innerText = `Please wait... (${count}/${AD_CONFIG.maxRetries})`;
        }

        function showError(message) {
            loaderView.classList.add('hidden');
            contentView.classList.remove('hidden');
            document.getElementById('title').innerText = "Error";
            description.innerText = message;
            directBtn.classList.remove('hidden');
        }

        function showFinalUI(titleText, descText, showDirect) {
            loaderView.classList.add('hidden');
            contentView.classList.remove('hidden');
            document.getElementById('title').innerText = titleText;
            description.innerText = descText;
            if (showDirect) directBtn.classList.remove('hidden');
        }

        // ========== POLLING МЕХАНИЗМ ==========
        async function doPoll() {
            if (!isPolling) return;

            try {
                const res = await fetch(`${apiBase}/api/check-status?ymid=${ymid}`);
                const data = await res.json();

                if (data.status === 'verified') {
                    isPolling = false;
                    onAdSuccess();
                    return;
                }

                if (data.status === 'expired' || data.status === 'not_found') {
                    isPolling = false;
                    showError("Session expired. Please try again.");
                    return;
                }

                // Safety cap: don't poll forever if the backend never confirms
                pollCount++;
                if (pollCount >= AD_CONFIG.maxPolls) {
                    isPolling = false;
                    showError("Taking too long. Please try again.");
                    return;
                }

                // Timer backstop: after ~20s without verification, offer the
                // claim button anyway (server enforces the real 20s age rule).
                // Polling continues so a late valued postback still auto-fires.
                if (!timerClaimShown && Date.now() - pollStartTime > 20000) {
                    timerClaimShown = true;
                    loaderSubtext.innerText = "You can take your video now";
                    wireClaimButton();
                }

                // Продолжаем polling
                pollTimeoutId = setTimeout(doPoll, AD_CONFIG.pollInterval);
            } catch (e) {
                // При ошибке сети ждём дольше
                pollTimeoutId = setTimeout(doPoll, AD_CONFIG.pollInterval * 2);
            }
        }

        function startPolling() {
            if (isPolling) return;
            isPolling = true;
            pollCount = 0;
            pollStartTime = Date.now();
            loaderText.innerText = "Waiting for verification...";
            loaderSubtext.innerText = "Please keep the app open";
            doPoll();
        }

        // ========== УРОВЕНЬ 1: SDK Ad ==========
        function trySDKAd() {
            if (typeof window[AD_CONFIG.sdkFn] === 'function') {
                loaderText.innerText = "Starting Ad";
                loaderSubtext.innerText = "Watch to support the bot!";
                currentAdSource = 'sdk';

                // catchIfNoFeed: a silent resolve with no actual ad must surface
                // as an error, not a phantom success
                let adPromise;
                try {
                    adPromise = window[AD_CONFIG.sdkFn]({ ymid: ymid, catchIfNoFeed: true, requestVar: 'sdk_interstitial' });
                } catch (e) {
                    console.error("Ad threw", e);
                    showNoAds();
                    return;
                }
                sdkWithTimeout(adPromise, 25000, 'sdk')
                    .then(() => {
                        // Polling starts once the ad actually played - the server
                        // confirms when the postback arrives
                        startPolling();
                    })
                    .catch((e) => {
                        console.error("Ad failed", e);
                        showNoAds();
                    });
            } else {
                retryCount++;
                updateRetryUI(retryCount);

                if (retryCount >= AD_CONFIG.maxRetries) {
                    showNoAds();
                    return;
                }
                retryTimerId = setTimeout(trySDKAd, AD_CONFIG.retryInterval);
            }
        }

        // ========== УРОВЕНЬ 2: Popup (быстрый оффер вместо SmartLink) ==========
        // Вызывается ТОЛЬКО из клика (требование popup-blocker'ов).
        // Постбэк impression прилетает как обычно; claim — общий.
        function tryPopup() {
            cancelRetry();
            stopPolling();
            if (popupTries >= AD_CONFIG.popupMaxTries) {
                showGuaranteedClaim();
                return;
            }
            popupTries++;
            loaderText.innerText = "Opening quick offer...";
            loaderSubtext.innerText = "Look at the offer, then return here";
            try {
                const popupPromise = window[AD_CONFIG.sdkFn]({
                    ymid: ymid,
                    type: 'pop',
                    requestVar: 'popup_retry_' + popupTries,
                    catchIfNoFeed: true
                });
                sdkWithTimeout(popupPromise, 25000, 'popup')
                    .then(() => {
                        startPolling();
                    })
                    .catch((e) => {
                        console.error("Popup failed", e);
                        showNoAds();
                    });
            } catch (e) {
                console.error("Popup threw", e);
                showNoAds();
            }
        }

        // Honest screen instead of dead waiting: no ads right now.
        // Offers the claim button too: by this point the server age rule
        // usually already passes, otherwise the claim auto-retries.
        function showNoAds() {
            stopPolling();
            cancelRetry();
            loaderView.classList.add('hidden');
            contentView.classList.remove('hidden');
            document.getElementById('title').innerText = "No ads right now 😕";
            description.innerText = "Try a quick offer, or come back later.";
            directBtn.innerText = "🎁 Quick offer";
            directAction = 'popup';
            directBtn.classList.remove('hidden');
            adBtn.innerText = "🔄 Try ad again";
            adBtn.classList.remove('hidden');
            wireClaimButton();
            // Passive background income, started only on this idle screen:
            // never overlaps an active rewarded flow, so ads can't stack.
            if (!inAppStarted) {
                inAppStarted = true;
                try {
                    window[AD_CONFIG.sdkFn]({
                        type: 'inApp',
                        inAppSettings: AD_CONFIG.inApp
                    });
                } catch (e) { console.error("In-App init failed", e); }
            }
        }

        // После исчерпания попыток: выдача по таймер-бэкстопу сервера
        function showGuaranteedClaim() {
            stopPolling();
            cancelRetry();
            loaderView.classList.add('hidden');
            contentView.classList.remove('hidden');
            document.getElementById('title').innerText = "Your video is ready!";
            description.innerText = "Tap below to get it.";
            wireClaimButton();
        }

        // Единый обработчик кнопки забора видео (регистрируется один раз,
        // иначе MainButton.onClick складывает дубли)
        async function onClaimTap() {
            tg.MainButton.showProgress();
            try {
                const claimRes = await fetch(`${apiBase}/api/claim-video`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ymid: ymid })
                });
                const claimData = await claimRes.json();
                if (claimData.success) {
                    tg.close();
                } else {
                    statusMsg.innerText = "❌ " + (claimData.error || "Please wait a moment...");
                    tg.MainButton.hideProgress();
                    // Сервер ещё не разрешил (слишком рано) — повтор через 10 сек
                    setTimeout(async () => {
                        try {
                            const r2 = await fetch(`${apiBase}/api/claim-video`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ ymid: ymid })
                            });
                            const d2 = await r2.json();
                            if (d2.success) { tg.close(); }
                            else { tg.MainButton.hideProgress(); }
                        } catch (e2) { tg.MainButton.hideProgress(); }
                    }, 10000);
                }
            } catch (e) {
                tg.close();
            }
        }

        // Общая привязка кнопки "забрать видео" (показ + уже зарегистрированный тап)
        function wireClaimButton() {
            tg.MainButton.setText("🚀 GET VIDEO NOW");
            tg.MainButton.show();
        }

        // ========== УСПЕШНЫЙ ПРОСМОТР ==========
        function onAdSuccess() {
            stopPolling();
            cancelRetry();

            loaderView.classList.add('hidden');
            contentView.classList.remove('hidden');

            document.getElementById('title').innerText = "Success!";
            description.innerText = "Your ad view has been verified. You can now claim your video.";
            wireClaimButton();

            if (tg.HapticFeedback) {
                tg.HapticFeedback.notificationOccurred('success');
            }
        }

        // ========== ИНИЦИАЛИЗАЦИЯ ==========
        tg.ready();
        tg.expand();
        // Кнопка забора регистрируется один раз на всё время жизни страницы
        tg.MainButton.onClick(onClaimTap);

        if (tg.themeParams.button_color) {
            document.documentElement.style.setProperty('--accent-color', tg.themeParams.button_color);
        }

        // Проверяем статус рекламы (ymid — чтобы сервер решил персонально:
        // админ с Admin Ads ON увидит реальную рекламу даже при глобальном OFF)
        fetch(`${apiBase}/api/ads-status?ymid=${encodeURIComponent(ymid)}`)
            .then(response => response.json())
            .then(data => {
                if (data.enabled) {
                    loaderText.innerText = "Checking Status";
                    loaderSubtext.innerText = "Please wait a moment...";
                    // In-App starts later, only on the idle no-ads screen,
                    // so it can never stack over an active rewarded ad.
                    trySDKAd();
                } else {
                    directAction = 'close';
                    directBtn.innerText = "🚀 Continue to Bot";
                    showFinalUI("Ready!", "Ads are currently disabled. You can go straight to the bot.", true);
                }
            })
            .catch(e => {
                console.error(e);
                showError("Could not reach the server.");
            });

        // Обработчик кнопки Start Ad Manually / Try ad again
        adBtn.addEventListener('click', () => {
            cancelRetry();
            stopPolling();
            retryCount = 0;
            popupTries = 0;
            adBtn.classList.add('hidden');
            loaderView.classList.remove('hidden');
            contentView.classList.add('hidden');
            trySDKAd();
        });

        // Обработчик кнопки Continue: действие зависит от экрана
        // ('popup' — открыть быстрый оффер, иначе просто закрыть окно)
        directBtn.addEventListener('click', () => {
            if (directAction === 'popup') {
                directAction = 'close';
                directBtn.innerText = "🚀 Continue to Bot";
                tryPopup();
            } else {
                tg.close();
            }
        });

        // Visibility API: Мгновенный запрос при возврате в приложение
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && isPolling) {
                clearTimeout(pollTimeoutId); // Отменяем ожидание
                doPoll(); // Делаем запрос ПРЯМО СЕЙЧАС
            }
        });
    </script>
</body>
</html>

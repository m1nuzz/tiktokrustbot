<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TikTok Downloader</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src='//libtl.com/sdk.js' data-zone='11093538' data-sdk='show_11093538' onerror="window._sdkLoadFailed = true" onload="window._sdkLoaded = true"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #38bdf8;
            --success-color: #22c55e;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Inter", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 24px;
            z-index: 10;
        }

        .glass-card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 32px 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        h1 {
            font-size: 28px;
            font-weight: 800;
            margin: 0 0 12px 0;
            letter-spacing: -0.025em;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 16px;
            color: var(--text-secondary);
            margin-bottom: 32px;
            line-height: 1.6;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 60px;
            border-radius: 16px;
            border: none;
            background-color: var(--accent-color);
            color: #ffffff;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
        }

        .btn:active {
            transform: scale(0.98);
            opacity: 0.9;
        }

        .btn-success {
            background-color: var(--success-color);
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
        }

        .spinner-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 5px solid rgba(255, 255, 255, 0.05);
            border-left-color: var(--accent-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .hidden {
            display: none;
        }

        .blob {
            position: absolute;
            width: 200px;
            height: 200px;
            background: var(--accent-color);
            filter: blur(80px);
            opacity: 0.15;
            border-radius: 50%;
            z-index: 1;
        }
        .blob-1 { top: 10%; left: -10%; }
        .blob-2 { bottom: 10%; right: -10%; background: #818cf8; }
    </style>
</head>
<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="container">
        <!-- Persistent Loader -->
        <div id="loader-view" class="spinner-container">
            <div class="spinner"></div>
            <h2 id="loader-text" style="font-size: 18px; color: var(--text-primary); margin: 0;">Loading...</h2>
            <span id="loader-subtext" style="font-size: 14px; color: var(--text-secondary);">Connecting to servers</span>
        </div>

        <!-- Result Card -->
        <div id="content-view" class="glass-card hidden">
            <h1 id="title">Success!</h1>
            <p id="description">Your ad view has been verified. You can now claim your video.</p>
            
            <button id="ad-btn" class="btn hidden">🎬 Start Ad Manually</button>
            <button id="claim-btn" class="btn hidden">🎬 Get my video</button>
            <button id="direct-btn" class="btn hidden">🚀 Continue to Bot</button>
            
            <div id="status-message" style="margin-top: 20px; font-size: 14px;"></div>
        </div>
    </div>

    <script>
        // SMARTLINK_INJECT
        // ========== КОНФИГУРАЦИЯ ==========
        const AD_CONFIG = {
            zone: '11093538',
            sdkFn: 'show_11093538',
            maxRetries: 8,
            retryInterval: 1200,
            pollInterval: 3000,
            maxPolls: 60, // ~3 min safety cap, then error screen
            popupMaxTries: 2,
            // The server unlocks a pending row only after ~20s (ad window) or
            // a valued postback, so a claim must be retried patiently.
            claimMaxAttempts: 8,
            claimRetryInterval: 8000,
            // Ad-blocked devices get a text-only screen; the watchdog reloads
            // the SDK in the background so unblocking resumes the ad itself.
            adblockWatchdogInterval: 5000,
            sdkCheckTimeout: 6000
        };

        // ========== СОСТОЯНИЕ ==========
        let retryCount = 0;
        let retryTimerId = null;
        let pollTimeoutId = null;
        let isPolling = false;
        let pollCount = 0;
        let popupTries = 0;
        let directAction = 'close'; // 'close' | 'popup' | 'claim'
        let currentAdSource = null; // 'sdk' или 'popup'
        let claimFired = false; // auto-claim guard: one claim per attempt
        let noAdsShown = false; // no-ads screen visible (upgradeable to adblock)
        let sdkLoadFailed = false; // SDK known missing: skip retry loops, fail fast
        let adblockDetected = false; // DNS filtering blocks the ad SDK host
        let sdkCheckRunning = false; // one SDK re-check at a time
        let adblockWatchdogId = null; // background SDK reload while blocked

        const tg = window.Telegram.WebApp;
        const loaderView = document.getElementById('loader-view');
        const loaderText = document.getElementById('loader-text');
        const loaderSubtext = document.getElementById('loader-subtext');
        const contentView = document.getElementById('content-view');
        const adBtn = document.getElementById('ad-btn');
        const claimBtn = document.getElementById('claim-btn');
        const directBtn = document.getElementById('direct-btn');
        const statusMsg = document.getElementById('status-message');
        const description = document.getElementById('description');
        const urlParams = new URLSearchParams(window.location.search);
        const ymid = urlParams.get('ymid') || 'unknown_request';
        const apiBase = window.location.origin;

        // ========== УТИЛИТЫ ==========
        function cancelRetry() {
            if (retryTimerId) {
                clearTimeout(retryTimerId);
                retryTimerId = null;
            }
        }

        function stopPolling() {
            isPolling = false;
            if (pollTimeoutId) {
                clearTimeout(pollTimeoutId);
                pollTimeoutId = null;
            }
        }

        // SDK-вызовы могут висеть вечно (нет рекламы, рваная сеть):
        // гонка с таймаутом превращает висение в обычную ошибку
        function sdkWithTimeout(promise, ms, label) {
            let timer = null;
            const timeout = new Promise((_, reject) => {
                timer = setTimeout(() => reject(new Error(label + ' timeout')), ms);
            });
            return Promise.race([promise, timeout]).finally(() => clearTimeout(timer));
        }

        function updateRetryUI(count) {
            loaderText.innerText = "Loading Ad...";
            loaderSubtext.innerText = `Please wait... (${count}/${AD_CONFIG.maxRetries})`;
        }

        function showError(message) {
            noAdsShown = false;
            loaderView.classList.add('hidden');
            contentView.classList.remove('hidden');
            document.getElementById('title').innerText = "Error";
            description.innerText = message;
            claimBtn.classList.add('hidden');
            directBtn.classList.remove('hidden');
        }

        function showFinalUI(titleText, descText, showDirect) {
            loaderView.classList.add('hidden');
            contentView.classList.remove('hidden');
            document.getElementById('title').innerText = titleText;
            description.innerText = descText;
            if (showDirect) directBtn.classList.remove('hidden');
            claimBtn.classList.add('hidden');
        }

        // ========== POLLING МЕХАНИЗМ ==========
        async function doPoll() {
            if (!isPolling) return;

            try {
                const res = await fetch(`${apiBase}/api/check-status?ymid=${ymid}`);
                const data = await res.json();

                if (data.status === 'verified') {
                    isPolling = false;
                    onAdSuccess();
                    return;
                }

                if (data.status === 'expired' || data.status === 'not_found') {
                    isPolling = false;
                    showError("Session expired. Please try again.");
                    return;
                }

                // Safety cap: don't poll forever if the backend never confirms
                pollCount++;
                if (pollCount >= AD_CONFIG.maxPolls) {
                    isPolling = false;
                    showError("Taking too long. Please try again.");
                    return;
                }

                // Polling continues so a late valued postback still auto-delivers.
                pollTimeoutId = setTimeout(doPoll, AD_CONFIG.pollInterval);
            } catch (e) {
                // При ошибке сети ждём дольше
                pollTimeoutId = setTimeout(doPoll, AD_CONFIG.pollInterval * 2);
            }
        }

        function startPolling() {
            if (isPolling) return;
            isPolling = true;
            pollCount = 0;
            loaderText.innerText = "Waiting for verification...";
            loaderSubtext.innerText = "Please keep the app open";
            doPoll();
        }

        // ========== УРОВЕНЬ 1: SDK Ad ==========
        function trySDKAd() {
            claimFired = false; // new attempt: allow one auto-claim
            if (window._sdkLoadFailed === true || sdkLoadFailed) {
                // Script tag errored or SDK already proven missing on this
                // device (DNS adblock): don't spin, go straight to a screen.
                sdkLoadFailed = true;
                showNoAdsOrAdblock();
                return;
            }
            if (typeof window[AD_CONFIG.sdkFn] === 'function') {
                loaderText.innerText = "Starting Ad";
                loaderSubtext.innerText = "Watch to support the bot!";
                currentAdSource = 'sdk';

                // catchIfNoFeed: a silent resolve with no actual ad must surface
                // as an error, not a phantom success
                let adPromise;
                try {
                    adPromise = window[AD_CONFIG.sdkFn]({ ymid: ymid, catchIfNoFeed: true, requestVar: 'sdk_interstitial' });
                } catch (e) {
                    console.error("Ad threw", e);
                    showNoAds();
                    return;
                }
                sdkWithTimeout(adPromise, 25000, 'sdk')
                    .then(() => {
                        // Auto-claim first, then keep polling: whichever wins
                        // (claim gate or valued postback auto-delivery) delivers once.
                        autoClaim();
                        startPolling();
                    })
                    .catch((e) => {
                        console.error("Ad failed", e);
                        showNoAds();
                    });
            } else {
                retryCount++;
                updateRetryUI(retryCount);

                if (retryCount >= AD_CONFIG.maxRetries) {
                    sdkLoadFailed = true; // fail fast on every later tap
                    showNoAdsOrAdblock();
                    return;
                }
                retryTimerId = setTimeout(trySDKAd, AD_CONFIG.retryInterval);
            }
        }

        // ========== УРОВЕНЬ 2: Popup (быстрый оффер вместо SmartLink) ==========
        // Вызывается ТОЛЬКО из клика (требование popup-blocker'ов).
        // Постбэк impression прилетает как обычно; claim — общий.
        function tryPopup() {
            claimFired = false; // new attempt: allow one auto-claim
            if (typeof window[AD_CONFIG.sdkFn] !== 'function') {
                // SDK missing (blocked script): the offer cannot open either,
                // so don't bounce back to the same screen — go to the video.
                sdkLoadFailed = true;
                adblockDetected = true;
                showAdblock();
                return;
            }
            cancelRetry();
            stopPolling();
            if (popupTries >= AD_CONFIG.popupMaxTries) {
                showGuaranteedClaim();
                return;
            }
            popupTries++;
            loaderText.innerText = "Opening quick offer...";
            loaderSubtext.innerText = "Look at the offer, then return here";
            try {
                const popupPromise = window[AD_CONFIG.sdkFn]({
                    ymid: ymid,
                    type: 'pop',
                    requestVar: 'popup_retry_' + popupTries,
                    catchIfNoFeed: true
                });
                sdkWithTimeout(popupPromise, 25000, 'popup')
                    .then(() => {
                        // Auto-claim first, then keep polling: whichever wins
                        // (claim gate or valued postback auto-delivery) delivers once.
                        autoClaim();
                        startPolling();
                    })
                    .catch((e) => {
                        console.error("Popup failed", e);
                        showNoAds();
                    });
            } catch (e) {
                console.error("Popup threw", e);
                showNoAds();
            }
        }

        // Honest screen instead of dead waiting: no ads right now.
        // The user picks the next step (quick offer or ad retry);
        // both paths auto-claim on resolve with zero extra taps.
        // Route to the honest screen: ad-blocked devices get a claim button
        // (ads can never load there), everyone else gets retry options.
        function showNoAdsOrAdblock() {
            if (adblockDetected) showAdblock();
            else showNoAds();
        }

        function showNoAds() {
            stopPolling();
            cancelRetry();
            noAdsShown = true;
            loaderView.classList.add('hidden');
            contentView.classList.remove('hidden');
            document.getElementById('title').innerText = "No ads right now 😕";
            description.innerText = "No ad is available at the moment. Take the video, try the quick offer, or retry the ad.";
            // Every visible button must do something: claim / offer / retry.
            claimBtn.innerText = "🎬 Get my video";
            claimBtn.classList.remove('hidden');
            directBtn.innerText = "🎁 Quick offer";
            directAction = 'popup';
            directBtn.classList.remove('hidden');
            adBtn.innerText = "🔄 Try ad again";
            adBtn.classList.remove('hidden');
        }

// Ad-blocked device: no ad view and no offer are possible. Text-only screen:
// we do not hand out the video for free and we do not offer dead buttons —
// just tell the user what to fix. A background watchdog reloads the SDK, so
// returning to the app after disabling the blocker resumes the ad by itself.
        function showAdblock() {
            stopPolling();
            cancelRetry();
            noAdsShown = false;
            loaderView.classList.add('hidden');
            contentView.classList.remove('hidden');
            document.getElementById('title').innerText = "🛡 Ad-block detected";
            description.innerText = "Ads cannot load while ad-blocking is on, so there is nothing to watch. Turn off ad-blocking for Telegram (your ad-blocker app, or the DNS / Private DNS setting) and come back — the ad will start automatically.";
            claimBtn.classList.add('hidden');
            adBtn.classList.add('hidden');
            directBtn.classList.add('hidden');
            armAdblockWatchdog();
        }

        // Polls for the SDK global: a fresh script tag may load and register it
        // before onload fires, so the wait must not depend on the event.
        function waitForSdk(ms) {
            return new Promise((resolve) => {
                const t0 = Date.now();
                const iv = setInterval(() => {
                    if (typeof window[AD_CONFIG.sdkFn] === 'function') {
                        clearInterval(iv);
                        resolve(true);
                    } else if (Date.now() - t0 > ms) {
                        clearInterval(iv);
                        resolve(false);
                    }
                }, 200);
            });
        }

        function armAdblockWatchdog() {
            if (adblockWatchdogId) return;
            adblockWatchdogId = setInterval(retrySdkSilently, AD_CONFIG.adblockWatchdogInterval);
        }

        function disarmAdblockWatchdog() {
            if (adblockWatchdogId) {
                clearInterval(adblockWatchdogId);
                adblockWatchdogId = null;
            }
            sdkCheckRunning = false;
        }

        // Reload the SDK in the background and start the ad the moment it
        // registers. No user interaction required.
        function retrySdkSilently() {
            if (sdkCheckRunning) return;
            if (typeof window[AD_CONFIG.sdkFn] === 'function') {
                startAdAttempt();
                return;
            }
            sdkCheckRunning = true;
            sdkLoadFailed = false;

            let settled = false;
            const finish = (ok) => {
                if (settled) return;
                settled = true;
                sdkCheckRunning = false;
                if (ok) startAdAttempt();
            };

            const script = document.createElement('script');
            script.src = 'https://libtl.com/sdk.js';
            script.async = true;
            script.setAttribute('data-zone', AD_CONFIG.zone);
            script.setAttribute('data-sdk', AD_CONFIG.sdkFn);
            script.onerror = () => finish(false);
            document.head.appendChild(script);

            waitForSdk(AD_CONFIG.sdkCheckTimeout).then(finish);
        }

        function startAdAttempt() {
            disarmAdblockWatchdog();
            adblockDetected = false;
            sdkLoadFailed = false;
            // Stale flag from the first blocked load would otherwise bounce us
            // straight back to the adblock screen.
            window._sdkLoadFailed = false;
            retryCount = 0;
            popupTries = 0;
            claimFired = false;
            directAction = 'close';
            loaderView.classList.remove('hidden');
            contentView.classList.add('hidden');
            trySDKAd();
        }

        // Popup tries exhausted: deliver via the server timer backstop, no taps.
        function showGuaranteedClaim() {
            stopPolling();
            cancelRetry();
            noAdsShown = false;
            loaderView.classList.add('hidden');
            contentView.classList.remove('hidden');
            document.getElementById('title').innerText = "Your video is ready!";
            description.innerText = "Taking it for you now.";
            claimBtn.classList.add('hidden');
            adBtn.classList.add('hidden');
            autoClaim();
        }

        // Single auto-claim: fired after any ad/popup resolves or when the user
        // takes the video, guarded so concurrent callers can't double-fire.
        // The server unlocks a pending row only after the ad window passes, so
        // this retries patiently instead of giving up and looking broken.
        async function autoClaim() {
            if (claimFired) return;
            claimFired = true;
            for (let attempt = 1; attempt <= AD_CONFIG.claimMaxAttempts; attempt++) {
                let ok = false;
                try {
                    const claimRes = await fetch(`${apiBase}/api/claim-video`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ ymid: ymid })
                    });
                    const claimData = await claimRes.json();
                    ok = !!claimData.success;
                } catch (e) {
                    ok = false; // network hiccup: retry
                }

                if (ok) {
                    tg.close();
                    return;
                }

                if (attempt === AD_CONFIG.claimMaxAttempts) {
                    showError("Couldn't confirm the download yet. Please open the bot and send the link again.");
                    return;
                }

                // Visible progress so the wait never looks like a dead button.
                claimBtn.innerText = `⏳ Preparing video... (${attempt}/${AD_CONFIG.claimMaxAttempts})`;
                claimBtn.classList.remove('hidden');
                await new Promise(r => setTimeout(r, AD_CONFIG.claimRetryInterval));
            }
        }

        // ========== УСПЕШНЫЙ ПРОСМОТР ==========
        function onAdSuccess() {
            stopPolling();
            cancelRetry();
            noAdsShown = false;

            loaderView.classList.add('hidden');
            contentView.classList.remove('hidden');

            document.getElementById('title').innerText = "Success!";
            description.innerText = "Your ad view has been verified. We are sending your video now.";
            claimBtn.classList.add('hidden');
            adBtn.classList.add('hidden');
            autoClaim();

            if (tg.HapticFeedback) {
                tg.HapticFeedback.notificationOccurred('success');
            }
        }

        // ========== ИНИЦИАЛИЗАЦИЯ ==========
        tg.ready();
        tg.expand();
        // No claim buttons anywhere: keep the main button hidden defensively.
        tg.MainButton.hide();

        if (tg.themeParams.button_color) {
            document.documentElement.style.setProperty('--accent-color', tg.themeParams.button_color);
        }

        // Adblock probe (parallel, non-blocking): DNS filtering blocks the
        // SDK host, so the script tag errors and every ad tap dead-ends.
        // A failed probe routes to the adblock screen with a claim button.
        fetch('https://libtl.com/sdk.js', { method: 'HEAD', mode: 'no-cors', cache: 'no-store' })
            .catch(() => {
                adblockDetected = true;
                // Late detection: upgrade the no-ads screen if already shown
                // and the SDK is still missing.
                if (noAdsShown && typeof window[AD_CONFIG.sdkFn] !== 'function') showAdblock();
            });

        // Проверяем статус рекламы (ymid — чтобы сервер решил персонально:
        // админ с Admin Ads ON увидит реальную рекламу даже при глобальном OFF)
        fetch(`${apiBase}/api/ads-status?ymid=${encodeURIComponent(ymid)}`)
            .then(response => response.json())
            .then(data => {
                if (data.enabled) {
                    loaderText.innerText = "Checking Status";
                    loaderSubtext.innerText = "Please wait a moment...";
                    // In-App starts later, only on the idle no-ads screen,
                    // so it can never stack over an active rewarded ad.
                    trySDKAd();
                } else {
                    directAction = 'close';
                    directBtn.innerText = "🚀 Continue to Bot";
                    showFinalUI("Ready!", "Ads are currently disabled. You can go straight to the bot.", true);
                }
            })
            .catch(e => {
                console.error(e);
                showError("Could not reach the server.");
            });

        // Обработчик кнопки Start Ad Manually / Try ad again
        adBtn.addEventListener('click', () => {
            cancelRetry();
            stopPolling();
            retryCount = 0;
            sdkLoadFailed = false; // explicit retry: one fresh attempt
            popupTries = 0;
            claimFired = false; // new attempt: allow one auto-claim
            adBtn.classList.add('hidden');
            claimBtn.classList.add('hidden');
            loaderView.classList.remove('hidden');
            contentView.classList.add('hidden');
            trySDKAd();
        });

// Claim button: the video itself. Re-arms the guard so a retry after an
        // error works, and gives instant feedback while the server waits out
        // the ad window.
        claimBtn.addEventListener('click', () => {
            cancelRetry();
            stopPolling();
            claimFired = false;
            claimBtn.innerText = "⏳ Preparing video...";
            autoClaim();
        });

        // Continue button: 'popup' opens the quick offer, otherwise close.
        directBtn.addEventListener('click', () => {
            if (directAction === 'popup') {
                directAction = 'close';
                directBtn.innerText = "🚀 Continue to Bot";
                tryPopup();
            } else {
                tg.close();
            }
        });

        // Visibility API: Мгновенный запрос при возврате в приложение
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState !== 'visible') return;
            if (isPolling) {
                clearTimeout(pollTimeoutId); // Отменяем ожидание
                doPoll(); // Делаем запрос ПРЯМО СЕЙЧАС
            } else if (adblockDetected) {
                // User most likely just switched off their ad-blocker: retry
                // the SDK right away instead of waiting for the watchdog tick.
                retrySdkSilently();
            }
        });
    </script>
</body>
</html>

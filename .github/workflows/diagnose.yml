# TEMPORARY DIAGNOSTIC WORKFLOW - DELETE AFTER USE.
# The Tests gate (test.yml) requires admin rights to read its job logs, so this
# throwaway run republishes the failure as GitHub annotations, which the public
# API can read. It does not relax any gate: the test command's exit code is
# preserved, so this job still fails whenever the suite fails.
name: Diagnose
on:
  push:
    branches:
      - "main"
  workflow_dispatch:
jobs:
  diagnose:
    name: diagnose test failures
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Run tests and report failures as annotations
        shell: bash
        run: |
          set +e
          set +o pipefail
          cargo test --all-targets > /tmp/test.log 2>&1
          rc=$?
          ann() {
            if [ -n "$2" ]; then
              printf '::error title=%s::%s\n' "$1" "$2"
            else
              printf '::notice title=%s::NOTHING MATCHED\n' "$1"
            fi
            return 0
          }
          failing=$(grep -oE '^test [A-Za-z0-9_:]+ \.\.\. FAILED' /tmp/test.log | sed -E 's/^test //; s/ \.\.\. FAILED$//' | paste -sd, -)
          result=$(grep -oE 'test result: [^;]+' /tmp/test.log | paste -sd' / ' -)
          compiles=$(grep -E '^error(\[E[0-9]+\])?: ' /tmp/test.log | head -3 | paste -sd' / ' -)
          panics=$(grep -oE 'panicked at [^,]+' /tmp/test.log | sort -u | paste -sd' / ' -)
          ann failing-tests "$failing"
          ann test-result "$result"
          ann compiler-errors "$compiles"
          ann panic-locations "$panics"
          exit "$rc"